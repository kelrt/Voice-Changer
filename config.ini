# the voice model is your own trained RVC v2 checkpoint.
CONTENTVEC_PATH = models/contentvec.onnx
MODEL_PATH = models/voice.pth

[NETWORK]
HOST = 127.0.0.1
PORT = 51235

# The voice model's sample rate and version are read from the checkpoint itself,
# so there is nothing to keep in sync here.
